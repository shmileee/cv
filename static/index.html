<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Oleksandr Ponomarov — CV</title>
    <meta
      name="description"
      content="Curriculum vitae of Oleksandr Ponomarov, Senior DevOps Engineer."
    />
    <link rel="canonical" href="https://cv.oponomarov.com/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Oleksandr Ponomarov — CV" />
    <meta
      property="og:description"
      content="Curriculum vitae of Oleksandr Ponomarov, Senior DevOps Engineer."
    />
    <meta property="og:url" content="https://cv.oponomarov.com/" />
    <meta name="twitter:card" content="summary" />

    <style>
      :root {
        color-scheme: light dark;
        /* The grey browsers themselves put behind an embedded PDF, so the
           page and the viewer chrome do not disagree while the PDF loads. */
        --backdrop: #525659;
        --surface: #ffffff;
        --ink: #1a1a1a;
      }

      /* The hand-off card pads a full-height box, so its padding has to sit
         inside that height or the page gains a scrollbar with nothing below
         the fold to scroll to. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--backdrop);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      .viewer {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* Shown only where an embedded PDF is not usable: iOS and Android
         render it as a blank box or a single frozen page, so those visitors
         get a deliberate hand-off to the file instead. */
      .handoff {
        display: none;
        min-height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }

      .handoff h1 {
        margin: 0;
        font-size: 1.4rem;
        color: var(--surface);
      }

      .handoff p {
        margin: 0;
        color: #c8ccd2;
      }

      .handoff .button {
        margin-top: 1.4rem;
        padding: 0.85rem 1.6rem;
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
      }

      .handoff .secondary {
        margin-top: 0.9rem;
        color: #c8ccd2;
        font-size: 0.9rem;
      }

      .inline-fallback {
        padding: 2rem;
        color: var(--surface);
        text-align: center;
      }

      @media (max-width: 760px) {
        .viewer {
          display: none;
        }

        .handoff {
          display: flex;
        }
      }
    </style>
  </head>

  <body>
    <object
      class="viewer"
      type="application/pdf"
      data="cv.pdf#view=FitH"
      title="Oleksandr Ponomarov — curriculum vitae"
    >
      <p class="inline-fallback">
        This browser cannot display PDFs inline.
        <a href="cv.pdf">Open the CV</a>.
      </p>
    </object>

    <main class="handoff">
      <h1>Oleksandr Ponomarov</h1>
      <p>Senior DevOps Engineer</p>
      <a class="button" href="cv.pdf">Open the CV</a>
      <a
        class="secondary"
        href="cv.pdf"
        download="Oleksandr-Ponomarov-CV.pdf"
        >Download the PDF</a
      >
    </main>
  </body>
</html>
