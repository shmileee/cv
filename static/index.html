<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Pages serves index.html for a directory and nothing else, so this
         redirect is what points the bare domain at the PDF. -->
    <meta http-equiv="refresh" content="0; url=cv.pdf#view=FitH" />

    <title>Oleksandr Ponomarov — CV</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Crawlers read this and do not follow the refresh, so a shared link
         still previews as a name rather than a bare URL. -->
    <meta property="og:title" content="Oleksandr Ponomarov — CV" />
    <meta
      property="og:description"
      content="Curriculum vitae of Oleksandr Ponomarov, Senior DevOps Engineer."
    />
    <meta property="og:url" content="https://cv.oponomarov.com/" />
  </head>

  <body>
    <a href="cv.pdf#view=FitH">Open the CV</a>
  </body>
</html>
